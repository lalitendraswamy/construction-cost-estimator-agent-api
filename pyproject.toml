[project]
name = "estimator-agent"
version = "0.1.0"
description = "Multi-agent Construction Estimator for Sadhguru Associates (LangChain + LangGraph + FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lalitendra" }]
dependencies = [
    # --- API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",  # UploadFile on /voice/transcribe
    "slowapi>=0.1.9",
    "httpx>=0.27",
    # --- Config / logging ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    # --- LangChain / LangGraph ---
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-google-genai>=4.0",  # Gemini chat + embeddings (free tier)
    "langchain-text-splitters>=0.3",
    "langchain-mongodb>=0.7",
    "langgraph-checkpoint-mongodb>=0.2",
    "langsmith>=0.3",
    # --- Data ---
    "pymongo>=4.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.scripts]
estimator-api = "estimator_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/estimator_agent"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = [
    "S101",                        # assert is fine in tests and invariants
    "E501",                        # ruff format owns line length; long i18n strings can't wrap
    "RUF001", "RUF002", "RUF003",  # ₹, ×, – and Telugu/Hindi text are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG"]
"scripts/**" = ["T201"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: needs the compiled graph (fake LLMs, no network)",
    "live: hits real LLM / MongoDB; run with -m live",
]
addopts = "-ra -m 'not live'"
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi",
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai",
]

[tool.coverage.run]
source = ["src/estimator_agent"]
branch = true
